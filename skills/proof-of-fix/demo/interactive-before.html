<!doctype html>
<html><head><meta charset="utf-8"><title>Demo before</title>
<style>body{font-family:sans-serif;padding:40px;background:#f6f7f9}
.card{max-width:600px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px}
button{background:#e11;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-size:16px}
#msg{margin-top:16px;color:#e11;font-weight:bold;min-height:24px}</style></head>
<body><div class="card"><h1>Transport order</h1>
<p>Press Save.</p>
<button id="save">Save</button>
<div id="msg"></div>
<script>document.getElementById('save').onclick=()=>{document.getElementById('msg').textContent='Error: saving failed (500)';};</script>
</div></body></html>
